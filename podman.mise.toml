# Setup Podman
# Usage: MISE_CONFIG_FILE=podman.mise.toml mise run

[tasks.001-apt-install-podman]
description = "Apt Install Podman"
run = """
sudo apt update
sudo apt install -y \
  podman \
  podman-docker \
  uidmap \
  slirp4netns \
  fuse-overlayfs
"""

[tasks.002-enable-podman]
description = "Systemctl Enable socket and create symlink"
run = """
systemctl --user enable --now podman.socket

# Wait briefly for socket to appear
sleep 1

PODMAN_SOCK="${XDG_RUNTIME_DIR}/podman/podman.sock"

if [ ! -S "$PODMAN_SOCK" ]; then
  echo "ERROR: Podman socket not found at $PODMAN_SOCK"
  exit 1
fi

sudo mkdir -p /var/run
sudo ln -sf "$PODMAN_SOCK" /var/run/docker.sock
"""
